name: CI/CD — Staging

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build and deploy (default: HEAD)"
        required: false
        default: "develop"

env:
  REGISTRY: ghcr.io
  PHP_IMAGE_NAME: ghcr.io/${{ github.repository }}/php
  CADDY_IMAGE_NAME: ghcr.io/${{ github.repository }}/caddy

jobs:
  # ============================================================
  # Job 1: PHP Linting (Laravel Pint)
  # ============================================================
  lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ""
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test

  # ============================================================
  # Job 2: PHP Tests (Pest)
  # ============================================================
  # test:
  #   name: PHP Tests
  #   runs-on: ubuntu-24.04
  #   concurrency:
  #     group: ci-test-${{ github.ref }}
  #     cancel-in-progress: true
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Setup PHP
  #       uses: shivammathur/setup-php@v2
  #       with:
  #         php-version: "8.4"
  #         extensions: pdo_sqlite, bcmath, mbstring, intl, pcntl, exif
  #         coverage: none
  #
  #     - name: Cache Composer dependencies
  #       uses: actions/cache@v4
  #       with:
  #         path: vendor
  #         key: composer-php8.4-${{ hashFiles('composer.lock') }}
  #         restore-keys: composer-php8.4-
  #
  #     - name: Install Composer dependencies
  #       run: composer install --no-scripts --no-interaction --prefer-dist
  #
  #     - name: Audit dependencies for known vulnerabilities
  #       run: composer audit
  #
  #     - name: Copy .env
  #       run: cp .env.example .env
  #
  #     - name: Generate application key
  #       run: php artisan key:generate
  #
  #     - name: Run migrations
  #       run: php artisan migrate --force
  #
  #     - name: Run tests
  #       run: composer test

  # ============================================================
  # Job 3: Frontend Asset Build (Vite)
  # ============================================================
  build-assets:
    name: Frontend Build (Vite)
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-build-assets-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
        env:
          NODE_ENV: production
          ACTIVE_THEME: default

  # ============================================================
  # Job 4: Build & Push Docker Images
  # ============================================================
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-24.04
    needs: [lint, build-assets]
    concurrency:
      group: ci-build-images-${{ github.ref }}
      cancel-in-progress: true

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    outputs:
      php_tag: ${{ steps.image-tags.outputs.php_tag }}
      caddy_tag: ${{ steps.image-tags.outputs.caddy_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PHP image metadata
        id: php-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PHP_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=staging

      - name: Extract Caddy image metadata
        id: caddy-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CADDY_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=staging

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.php-meta.outputs.tags }}
          labels: ${{ steps.php-meta.outputs.labels }}
          build-args: |
            ACTIVE_THEME=default
          cache-from: type=registry,ref=${{ env.PHP_IMAGE_NAME }}:staging
          cache-to: type=inline

      # BuildKit reuses cached composer-builder/node-builder layers from the
      # step above, so this second build is typically very fast.
      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: caddy-stage
          push: true
          tags: ${{ steps.caddy-meta.outputs.tags }}
          labels: ${{ steps.caddy-meta.outputs.labels }}
          build-args: |
            ACTIVE_THEME=default
          cache-from: type=registry,ref=${{ env.CADDY_IMAGE_NAME }}:staging
          cache-to: type=inline

      - name: Get SHA image tags
        id: image-tags
        run: |
          PHP_SHA=$(echo "${{ steps.php-meta.outputs.tags }}" | tr ',' '\n' | grep "sha-" | head -1)
          CADDY_SHA=$(echo "${{ steps.caddy-meta.outputs.tags }}" | tr ',' '\n' | grep "sha-" | head -1)
          echo "php_tag=$PHP_SHA" >> $GITHUB_OUTPUT
          echo "caddy_tag=$CADDY_SHA" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 5: Deploy to Staging (Docker Swarm via SSH context)
  # Only runs on push to develop or workflow_dispatch.
  # A deploy killed mid-rollout leaves the stack in an indeterminate
  # state, so we queue (cancel-in-progress: false) rather than cancel.
  # ============================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: [build-images]
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH for Docker context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/vps_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Create Docker context
        run: |
          docker context create vps \
            --docker "host=ssh://deploy@${{ secrets.VPS_HOST }}"

      # PHP_IMAGE and CADDY_IMAGE are read by docker stack deploy for
      # variable substitution in docker-stack.yml.
      - name: Deploy stack to Swarm
        env:
          PHP_IMAGE: ${{ needs.build-images.outputs.php_tag }}
          CADDY_IMAGE: ${{ needs.build-images.outputs.caddy_tag }}
        run: |
          docker --context vps stack deploy \
            --compose-file infra/docker-stack.yml \
            --with-registry-auth \
            --prune \
            nikeflow

      # Polls until all php replicas are running or times out after 200s.
      - name: Wait for rollout
        run: |
          echo "=== Waiting for nikeflow_php rollout ==="
          for i in $(seq 1 40); do
            REPLICAS=$(docker --context vps service ls \
              --filter name=nikeflow_php \
              --format "{{.Replicas}}" 2>/dev/null || echo "0/0")
            RUNNING=$(echo "$REPLICAS" | cut -d'/' -f1)
            DESIRED=$(echo "$REPLICAS" | cut -d'/' -f2)
            echo "  Replicas: $REPLICAS ($i/40)"
            if [ "$RUNNING" = "$DESIRED" ] && [ "$DESIRED" != "0" ]; then
              echo "Rollout complete after $((i * 5))s."
              exit 0
            fi
            if [ "$i" -eq 40 ]; then
              echo "ERROR: Rollout did not complete in 200s."
              docker --context vps service ps nikeflow_php --no-trunc
              exit 1
            fi
            sleep 5
          done

      - name: Prune dangling images on VPS
        run: docker --context vps image prune -f
