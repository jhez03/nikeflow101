# Production environment overrides for docker-stack.yml.
# Used alongside the base file:
#   docker stack deploy \
#     --compose-file infra/docker-stack.yml \
#     --compose-file infra/docker-stack.production.yml \
#     nikeflow
#
# Docker Swarm merges compose files in order — values here override the base.

services:
  php:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://yourdomain.com   # TODO: replace with real production domain
      LOG_LEVEL: error
