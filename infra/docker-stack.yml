# Docker Swarm Stack — nikeflow
#
# Deploy (from project root):
#   export PHP_IMAGE=ghcr.io/owner/repo/php:sha-abc1234
#   export NGINX_IMAGE=ghcr.io/owner/repo/nginx:sha-abc1234
#   docker --context vps stack deploy \
#     --compose-file infra/docker-stack.yml \
#     --with-registry-auth \
#     --prune \
#     nikeflow
#
# Secrets must be pre-created on the Swarm manager before first deploy:
#   printf 'base64:...' | docker --context vps secret create app_key -
#   printf 'password'   | docker --context vps secret create db_password -
#   printf 'laravel'    | docker --context vps secret create db_username -
#   printf 'rootpass'   | docker --context vps secret create mysql_root_password -
#
# External volume must also be pre-created:
#   docker --context vps volume create nikeflow_db_data

version: "3.9"

services:

  # ── Caddy: TLS termination + reverse proxy ──────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host      # host mode bypasses Swarm routing mesh — required for ACME HTTP-01
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      - frontend
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data      # Let's Encrypt certificates — must survive redeploys
      - caddy_config:/config
    deploy:
      replicas: 1
      update_config:
        order: stop-first     # port 80/443 cannot be double-bound
        failure_action: rollback
      restart_policy:
        condition: on-failure

  # ── nginx: static asset serving + FastCGI proxy to php ──────────────────
  nginx:
    image: ${NGINX_IMAGE}
    networks:
      - frontend
      - backend
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first    # bring up new replica before removing old one
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure

  # ── php: Laravel application (PHP-FPM) ──────────────────────────────────
  php:
    image: ${PHP_IMAGE}
    networks:
      - backend
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_URL: https://staging.example.com
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: laravel
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      TRUSTED_PROXIES: "*"
    secrets:
      - app_key
      - db_password
      - db_username
    volumes:
      - app_storage:/var/www/storage
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first    # new replica starts and passes healthcheck before old one stops
        delay: 10s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: continue
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://nginx/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s     # time for entrypoint migrate + cache warm-up

  # ── worker: Laravel queue worker ────────────────────────────────────────
  worker:
    image: ${PHP_IMAGE}
    command: ["php", "/var/www/artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    networks:
      - backend
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: laravel
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    secrets:
      - app_key
      - db_password
      - db_username
    volumes:
      - app_storage:/var/www/storage
    deploy:
      replicas: 1
      update_config:
        order: stop-first     # drain in-flight jobs before stopping
        failure_action: rollback
      restart_policy:
        condition: on-failure

  # ── scheduler: Laravel task scheduler ───────────────────────────────────
  scheduler:
    image: ${PHP_IMAGE}
    command: ["php", "/var/www/artisan", "schedule:work"]
    networks:
      - backend
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: laravel
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    secrets:
      - app_key
      - db_password
      - db_username
    volumes:
      - app_storage:/var/www/storage
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  # ── db: MySQL database ───────────────────────────────────────────────────
  db:
    image: mysql:8.0
    networks:
      - backend
    environment:
      MYSQL_DATABASE: laravel
      # mysql:8.0 natively reads *_FILE variables — no custom entrypoint needed.
      MYSQL_USER_FILE: /run/secrets/db_username
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - db_username
      - db_password
      - mysql_root_password
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # ensures db always runs on the node owning db_data volume
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true    # no direct internet access for backend services

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_username:
    external: true
  mysql_root_password:
    external: true

configs:
  caddyfile:
    file: ./Caddyfile
  nginx_conf:
    file: ./docker/nginx/default.conf

volumes:
  db_data:
    external: true      # pre-created: `docker volume create nikeflow_db_data`
                        # external: true prevents `stack rm` from deleting production data
  app_storage:          # shared across php/worker/scheduler replicas (storage/ directory)
  caddy_data:           # Let's Encrypt certificates
  caddy_config:         # Caddy internal config state
