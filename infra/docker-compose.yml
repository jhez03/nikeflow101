services:
    php:
        build:
            context: ..
            dockerfile: infra/Dockerfile
            target: development
        volumes:
            - ../:/var/www
        env_file:
            - .env.docker
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    caddy:
        image: caddy:2-alpine
        ports:
            - "80:80"
        volumes:
            - ../:/var/www
            - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
        depends_on:
            - php

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

    db:
        image: mysql:8.0
        env_file:
            - .env.docker
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    db_data:
