opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; validate_timestamps=0: never re-check mtime of PHP files after the first compile.
; Safe for immutable Docker deployments — the image is rebuilt on every deploy,
; so there is no scenario where a cached file is stale while the container is running.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
