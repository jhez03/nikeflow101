services:
  php:
    image: ${PHP_IMAGE}
    restart: unless-stopped
    env_file:
      - /opt/staging/ec_starter_kit/.env
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    networks:
      - app-network

  worker:
    image: ${PHP_IMAGE}
    restart: unless-stopped
    command:
      [
        "php",
        "/var/www/artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=60",
      ]
    env_file:
      - /opt/staging/ec_starter_kit/.env
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app-network

  scheduler:
    image: ${PHP_IMAGE}
    restart: unless-stopped
    command: ["php", "/var/www/artisan", "schedule:work"]
    env_file:
      - /opt/staging/ec_starter_kit/.env
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - /opt/staging/ec_starter_kit/.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

volumes:
  db_data:
    external: true
    name: ec_starter_kit_db_data
  redis_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
